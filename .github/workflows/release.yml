name: Release

# Push a tag like v1.2.3 to release, or run the workflow by hand with a tag name. This workflow then
#   1. checks that dist/ is up to date and the tests pass,
#   2. creates the tag v1.2.3 at the selected branch's head if it doesn't exist yet (manual runs only),
#   3. creates a draft GitHub release for v1.2.3,
#   4. moves the floating tags v1.2 and v1 to it (only if it's the newest release in that line).
# Then publish the draft by hand (Releases -> Edit -> tick "Publish this Action to the GitHub
# Marketplace" -> Publish release). GitHub has no API for the Marketplace checkbox.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0) to (re-)publish and point v1.0 / v1 at. Created at the head of the selected branch if it doesn't exist.
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag
        id: tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${TAG}' is not a release tag of the form vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} exists, releasing it."
            git checkout --detach "refs/tags/${TAG}"
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${TAG} does not exist, it will be created at ${GITHUB_REF_NAME} ($(git rev-parse --short HEAD)) once the checks pass."
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check dist/ is up to date
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ in ${TAG} is out of date. Run 'npm run build', commit, and tag a new version."
            exit 1
          fi
      - run: npm test

      - name: Create tag
        if: steps.tag.outputs.create == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/${TAG}"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes
          fi
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == "true" ]]; then
            {
              echo "### Draft release ${TAG} is ready"
              echo
              echo "To publish it to the GitHub Marketplace, open [Releases](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases), edit the **${TAG}** draft, make sure **Publish this Action to the GitHub Marketplace** is ticked, and click **Publish release**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update floating tags
        run: .github/scripts/update-floating-tags.sh "$TAG"
