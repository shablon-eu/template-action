name: Shablon Template Sync
description: Create or update MJML email templates in Shablon from files in your repository.
author: Michael Schramm
branding:
  icon: mail
  color: blue

inputs:
  apiKey:
    description: Shablon API key (e.g. `sk.****`). Store it as a secret.
    required: true
  basePath:
    description: Folder (relative to the repository root) that contains the `<slug>.mjml` / `<slug>.yaml` files. Searched recursively.
    required: true
  apiUrl:
    description: Base URL of the Shablon API.
    required: false
    default: https://api.shablon.eu
  dryRun:
    description: Validate templates and show what would change without creating or updating anything.
    required: false
    default: 'false'
  prune:
    description: >-
      What to do with a Shablon template that has the slug of a `variants:` file but matches none of its variants:
      `disable` (set `enabled: false`), `delete`, or `warn` (leave it and add a warning annotation).
    required: false
    default: disable
  slugFrom:
    description: >-
      How a template's slug is derived: `file` uses the file name (`partials/header.mjml` → `header`),
      `path` keeps the folders below `basePath` (`partials/header.mjml` → `partials/header`), the slug
      Shablon resolves `<mj-include path="partials/header.mjml" />` to.
    required: false
    default: file

outputs:
  created:
    description: JSON array of templates that were created (`<slug>`, or `<slug>.<variant>` for variants).
  updated:
    description: JSON array of templates that were updated.
  unchanged:
    description: JSON array of templates that were already up to date.
  disabled:
    description: 'JSON array of templates disabled by `prune: disable`, as `<slug>#<id>`.'
  deleted:
    description: 'JSON array of templates deleted by `prune: delete`, as `<slug>#<id>`.'

runs:
  using: node24
  main: dist/index.js
